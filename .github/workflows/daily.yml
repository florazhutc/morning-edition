name: Daily Magazine

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Generate magazine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MORNING_EDITION_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python3 generate_magazine.py

      - name: Update index.html
        run: python3 update_index.py

      - name: Commit and push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Morning Edition Bot"
          git add -A
          git commit -m "📰 Auto-publish $(date +%Y-%m-%d)" || true
          git push || true