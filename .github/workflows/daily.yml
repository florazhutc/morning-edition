name: Daily Magazine

on:
  schedule:
    # UTC 5am = 北京时间 13:00
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Generate magazine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python3 generate_magazine.py

      - name: Commit & Push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Morning Edition Bot"
          git add magazines/ index.html
          git commit -m "📰 Auto-publish $(date +%Y-%m-%d)" || exit 0
          git push