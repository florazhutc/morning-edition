name: Daily Magazine

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Generate magazine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MORNING_EDITION_EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          MORNING_EDITION_SITE_URL: https://morning-edition.vercel.app
          MORNING_EDITION_REQUIRE_EMAIL: "true"
        run: python3 generate_magazine.py

      - name: Update archive index
        run: python3 update_archive.py

      - name: Commit and push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Morning Edition Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "📰 Auto-publish $(date +%Y-%m-%d)"
            git push
          fi
